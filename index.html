<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog App</title>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #f8f9fa; padding: 20px; }
h1 { margin-bottom: 30px; }
.card { margin-bottom: 20px; }
.post { border-top: 1px solid #dee2e6; padding-top: 10px; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
    <h1 class="text-center">📝 Blog App</h1>

    <div class="row">
        <!-- Create User -->
        <div class="col-md-6">
            <div class="card p-3">
                <h4>Create User</h4>
                <input type="text" id="first_name" class="form-control mb-2" placeholder="First Name">
                <input type="text" id="last_name" class="form-control mb-2" placeholder="Last Name">
                <button class="btn btn-primary w-100" onclick="createUser()">Add User</button>
            </div>
        </div>

        <!-- Create Post -->
        <div class="col-md-6">
            <div class="card p-3">
                <h4>Create Post</h4>
                <input type="text" id="post_title" class="form-control mb-2" placeholder="Title">
                <textarea id="post_content" class="form-control mb-2" placeholder="Content"></textarea>
                <input type="number" id="post_user_id" class="form-control mb-2" placeholder="User ID">
                <button class="btn btn-success w-100" onclick="createPost()">Add Post</button>
            </div>
        </div>
    </div>

    <hr>

    <!-- Users List -->
    <h3>Users</h3>
    <div id="users" class="row"></div>

    <hr>

    <!-- Posts List -->
    <h3>Posts</h3>
    <div id="posts" class="row"></div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = "http://127.0.0.1:8000/api";

// ===== Users =====
async function loadUsers() {
    const res = await fetch(`${API_BASE}/users/`);
    const users = await res.json();
    const usersDiv = document.getElementById("users");
    usersDiv.innerHTML = "";

    users.forEach(user => {
        const div = document.createElement("div");
        div.className = "col-md-4";
        let postsHtml = "";
        if (user.posts.length > 0) {
            postsHtml = "<ul class='list-group list-group-flush'>";
            user.posts.forEach(post => {
                postsHtml += `<li class='list-group-item d-flex justify-content-between align-items-center'>
                                ${post.title}
                                <button class='btn btn-sm btn-danger' onclick="deletePost(${post.id})">Delete</button>
                              </li>`;
            });
            postsHtml += "</ul>";
        }

        div.innerHTML = `
            <div class="card p-3">
                <h5>${user.first_name} ${user.last_name} (ID: ${user.id})</h5>
                ${postsHtml}
            </div>
        `;
        usersDiv.appendChild(div);
    });
}

async function createUser() {
    const first_name = document.getElementById("first_name").value;
    const last_name = document.getElementById("last_name").value;

    if (!first_name || !last_name) return alert("Fill all fields");

    await fetch(`${API_BASE}/users/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ first_name, last_name })
    });

    document.getElementById("first_name").value = "";
    document.getElementById("last_name").value = "";
    loadUsers();
}

// ===== Posts =====
async function loadPosts() {
    const res = await fetch(`${API_BASE}/posts/`);
    const posts = await res.json();
    const postsDiv = document.getElementById("posts");
    postsDiv.innerHTML = "";

    posts.forEach(post => {
        const div = document.createElement("div");
        div.className = "col-md-4";
        div.innerHTML = `
            <div class="card p-3 post">
                <h5>${post.title}</h5>
                <p>${post.content}</p>
                <small>User ID: ${post.user_id}</small>
                <br>
                <button class="btn btn-sm btn-danger mt-2" onclick="deletePost(${post.id})">Delete</button>
            </div>
        `;
        postsDiv.appendChild(div);
    });
}

async function createPost() {
    const title = document.getElementById("post_title").value;
    const content = document.getElementById("post_content").value;
    const user_id = parseInt(document.getElementById("post_user_id").value);

    if (!title || !content || !user_id) return alert("Fill all fields");

    const res = await fetch(`${API_BASE}/posts/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content, user_id })
    });

    if (!res.ok) {
        const err = await res.json();
        return alert(err.detail);
    }

    document.getElementById("post_title").value = "";
    document.getElementById("post_content").value = "";
    document.getElementById("post_user_id").value = "";
    loadPosts();
    loadUsers();
}

async function deletePost(post_id) {
    await fetch(`${API_BASE}/posts/${post_id}`, { method: "DELETE" });
    loadPosts();
    loadUsers();
}

// Load data on page load
window.onload = () => {
    loadUsers();
    loadPosts();
}
</script>
</body>
</html>
